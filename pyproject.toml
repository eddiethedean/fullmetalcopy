[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullmetalcopy"
description = "Faster PostgreSQL bulk inserts by copying CSV into a table via SQLAlchemy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Odos Matthews" }]
keywords = ["postgresql", "copy", "csv", "sqlalchemy", "bulk-insert", "asyncpg", "psycopg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
version = "0.2.0"

dependencies = [
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
psycopg = ["psycopg>=3.1", "sqlalchemy[asyncio]"]
psycopg2 = ["psycopg2-binary>=2.9"]
asyncpg = ["asyncpg>=0.29", "sqlalchemy[asyncio]"]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.20"]
dev = [
  "asyncpg>=0.29",
  "mypy>=1.8",
  "psycopg[binary]>=3.1",
  "psycopg2-binary>=2.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "testing.postgresql>=1.3",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/fullmetalcopy"
Repository = "https://github.com/eddiethedean/fullmetalcopy"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullmetalcopy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=fullmetalcopy --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["fullmetalcopy"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["fullmetalcopy", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["fullmetalcopy"]

[tool.mypy]
python_version = "3.10"
packages = ["fullmetalcopy"]
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
